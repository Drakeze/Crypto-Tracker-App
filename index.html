<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTracker - Top 300 Cryptocurrencies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Crypto Tracker</h1>
            <p>Top 300 Cryptocurrencies by Market Cap</p>
        </header>

        <div class="controls">
            <select id="sortSelect">
                <option value="market_cap_desc">Market Cap (High to Low)</option>
                <option value="market_cap_asc">Market Cap (Low to High)</option>
                <option value="price_desc">Price (High to Low)</option>
                <option value="price_asc">Price (Low to High)</option>
                <option value="change_desc">24h Change (High to Low)</option>
                <option value="change_asc">24h Change (Low to High)</option>
            </select>
            
            <label>
                <input type="checkbox" id="showFavs">
                Show Favorites Only
            </label>
            
            <button id="refreshBtn">Refresh</button>
            <span id="count">0 coins</span>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading cryptocurrencies...</p>
            <p id="status" aria-live="polite">Fetching data...</p>
        </div>

        <div id="error" class="error hidden">
            <p id="errorMsg"></p>
            <button id="retryBtn">Try Again</button>
        </div>

        <div id="empty" class="empty hidden">
            <p>No favorite coins yet. Click the ♥ icon to add some!</p>
        </div>

        <div id="grid" class="grid"></div>

        <footer>
            <p>Data from <a href="https://www.coingecko.com" target="_blank">CoinGecko</a></p>
            <p>Last updated: <span id="lastUpdate">Never</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
